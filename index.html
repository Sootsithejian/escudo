<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escudo medieval</title>

<!-- CSP: permite blob: (texturas incrustadas en el GLB) y Three.js desde jsDelivr.
     Si tu servidor (Express/helmet/nginx) envía su propio header Content-Security-Policy,
     ese header también se aplica y debe incluir lo mismo, o quitarse. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  connect-src 'self' blob: data: https://cdn.jsdelivr.net;
  worker-src 'self' blob:;
  child-src 'self' blob:;
">

<style>
  :root {
    --bg: #1c1a18;
    --panel: #26231f;
    --text: #efe8dc;
    --muted: #a89f90;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header { padding: 14px 16px; text-align: center; background: var(--panel); }
  h1 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: .02em; }
  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  #status {
    position: absolute; inset: 0; display: grid; place-items: center;
    text-align: center; padding: 24px; color: var(--muted); pointer-events: none;
  }
  #status.hidden { display: none; }
  #status.error { color: #e9806e; }
  footer { padding: 10px 16px; text-align: center; font-size: .9rem; color: var(--muted); background: var(--panel); }
</style>
</head>
<body>
  <header><h1>Escudo medieval</h1></header>
  <div id="stage"><div id="status">Cargando modelo…</div></div>
  <footer>Arrastra para girar · rueda o pellizco para acercar · clic derecho para mover</footer>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // Cambia esta ruta si tu GLB tiene otro nombre o está en otra carpeta
    const MODEL_URL = './Escudo_pintado1.glb';

    const stage  = document.getElementById('stage');
    const status = document.getElementById('status');

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    stage.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2b2825);

    // Iluminación: environment para materiales PBR + luces directas
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.add(new THREE.AmbientLight(0xffffff, 0.35));
    const sun = new THREE.DirectionalLight(0xffffff, 2.0);
    sun.position.set(3, 4, 5);
    scene.add(sun);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
    camera.position.set(0, 0, 3);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = true;
    controls.enableZoom = true;

    function resize() {
      const w = stage.clientWidth, h = stage.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(stage);
    resize();

    new GLTFLoader().load(
      MODEL_URL,
      (gltf) => {
        const model = gltf.scene;
        scene.add(model);

        // Centrar y encuadrar el modelo automáticamente
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);

        const maxDim = Math.max(size.x, size.y, size.z);
        const dist = (maxDim / 2) / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.4;
        camera.position.set(0, 0, dist);
        camera.near = dist / 100;
        camera.far = dist * 100;
        camera.updateProjectionMatrix();
        controls.minDistance = dist * 0.3;
        controls.maxDistance = dist * 3;
        controls.update();

        status.classList.add('hidden');
      },
      (e) => {
        if (e.total) status.textContent = 'Cargando modelo… ' + Math.round(e.loaded / e.total * 100) + '%';
      },
      (err) => {
        console.error(err);
        status.classList.add('error');
        status.textContent = 'No se pudo cargar el modelo. Revisa que Escudo_pintado1.glb esté junto a index.html.';
      }
    );

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
